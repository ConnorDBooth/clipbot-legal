<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clipbot login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
  textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 15px; }
</style>
</head>
<body>
<h1>Clipbot login</h1>
<p id="msg">Copy the URL below and paste it into the terminal running <code>tiktok_auth.py</code>.</p>
<textarea id="url" readonly></textarea>
<button id="copy">Copy</button>
<script>
  var box = document.getElementById("url");
  box.value = window.location.href;
  if (!new URLSearchParams(window.location.search).get("code")) {
    document.getElementById("msg").textContent =
      "No login code found. Run tiktok_auth.py and approve the TikTok login again.";
  }
  document.getElementById("copy").onclick = function () {
    box.select();
    try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
    this.textContent = "Copied";
  };
</script>
</body>
</html>
